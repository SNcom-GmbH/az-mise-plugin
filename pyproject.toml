[project]
name = "mise-azure-ac"
version = "0.1.0"
description = "Azure SDK helper for the azure-ac mise backend"
requires-python = ">=3.12"
dependencies = [
	"azure-identity==1.25.1",
	"azure-identity-broker==1.3.0; sys_platform == 'win32'",
	"azure-storage-blob==12.27.1",
]

[dependency-groups]
dev = ["ruff==0.14.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
