[package]
name = "azure-ac"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Rust helper for the Azure Blob mise backend"

[dependencies]
anyhow = "1"
async-trait = "0.1"
azure_core = { version = "1.1", default-features = false, features = ["reqwest", "tokio"] }
azure_identity = { version = "1", default-features = false, features = ["tokio"] }
azure_storage_blob = { version = "1.1", default-features = false, features = ["tokio"] }
bzip2 = "0.6"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures = "0.3"
hex = "0.4"
lzma-rust2 = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs"] }
url = "2"
zip = { version = "6", default-features = false, features = ["deflate-flate2"] }

[target."cfg(windows)".dependencies]
base64 = "0.22"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Security_Authentication_Web_Core", "Security_Credentials", "Win32_System_WinRT", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }
windows-future = "0.3"

[dev-dependencies]
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
unwrap_used = "warn"
