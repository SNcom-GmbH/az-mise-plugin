[plugins]
azure-blob = "https://github.com/SNcom-GmbH/az-mise-plugin.git#v0.6.1"

[tools."azure-blob:hello"]
version = "1.0.0"
storage_url = "https://youraccount.blob.core.windows.net/tools"

# Optional enterprise identity settings (same tool table):
# tenant_id = "your-tenant-id"
# client_id = "your-public-client-app-id"
#
# Azure Pipelines (recommended): InstallBuilder@2 supplies
# AZURE_BLOB_STORAGE_TOKEN in the task environment.
#
# Direct service principal instead: map AZURE_TENANT_ID, AZURE_CLIENT_ID and the
# AZURE_CLIENT_SECRET secret into the environment, then set:
# auth = "environment"
#
# Optional independent artifact pin (64 hex characters):
# sha256 = "..."
#
# Optional user-assigned managed identity:
# auth = "managed"
# managed_identity_client_id = "..."
#
# The ref pins the plugin version; version above selects the tool version.
# Use a full commit SHA instead of the tag for an immutable plugin pin.
