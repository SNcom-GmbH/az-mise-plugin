[tools]
uv = "0.13.4"

[tasks.test]
description = "Run offline unit tests"
run = "uv run --locked python -m unittest discover -s tests -v"

[tasks.lint]
description = "Check Python formatting and lint"
run = ["uv run --locked ruff check .", "uv run --locked ruff format --check ."]

[tasks.check]
description = "Run all local checks"
depends = ["test", "lint"]

[tasks.blob]
description = "List, read, download or upload blobs using plugin authentication"
run = "uv run --quiet --locked python src/azure_ac.py"
